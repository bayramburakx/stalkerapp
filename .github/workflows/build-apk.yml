name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Restore google-services.json
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > app/google-services.json

      - name: Restore release keystore
        run: |
          mkdir -p keystore
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore/release.p12
          echo "KEYSTORE_PATH=${{ github.workspace }}/keystore/release.p12" >> "$GITHUB_ENV"

      # Her push'ta sürüm otomatik artırılır: uygulama içi güncelleyici
      # (GitHub Releases karşılaştırması) yeni APK'yı algılayıp pop-up gösterebilsin.
      - name: Bump build version
        run: |
          BUILD=$(git rev-list --count HEAD)
          sed -i "s/versionCode = [0-9]*/versionCode = $BUILD/" app/build.gradle.kts
          sed -i "s/versionName = \"[^\"]*\"/versionName = \"1.0.$BUILD\"/" app/build.gradle.kts

      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Extract version
        id: ver
        run: |
          V=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: portio-release
          path: app/build/outputs/apk/release/*.apk

      - name: Publish APK to Release (latest)
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'push'
        with:
          tag_name: latest
          name: Portio v${{ steps.ver.outputs.version }} – Latest APK
          body: |
            Automatically built APK (refreshed on every push).

            Recent changes:
            - Full English localization (Turkish source + English dictionary)
            - Sub-menu: black bar removed, pill-shaped backgrounds only
            - Hero banner enlarged to ~1/3 of the screen
            - VOD sync fixed: full catalog (80k+ items) is fetched
            - Stale/incomplete catalogs are re-synced automatically
            - Secrets moved out of the repo (keystore + google-services.json via GitHub Secrets)
          files: app/build/outputs/apk/release/*.apk
          update_existing: true
          overwrite: true
          token: ${{ secrets.GITHUB_TOKEN }}