name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Restore google-services.json
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > app/google-services.json

      - name: Restore release keystore
        run: |
          mkdir -p keystore
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore/release.p12
          echo "KEYSTORE_PATH=${{ github.workspace }}/keystore/release.p12" >> "$GITHUB_ENV"

      # Her push'ta sürüm otomatik artırılır: uygulama içi güncelleyici
      # (GitHub Releases karşılaştırması) yeni APK'yı algılayıp pop-up gösterebilsin.
      - name: Bump build version
        run: |
          BUILD=$(git rev-list --count HEAD)
          sed -i "s/versionCode = [0-9]*/versionCode = $BUILD/" app/build.gradle.kts
          sed -i "s/versionName = \"[^\"]*\"/versionName = \"1.0.$BUILD\"/" app/build.gradle.kts

      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Extract version
        id: ver
        run: |
          V=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: portio-release
          path: app/build/outputs/apk/release/*.apk

      # GitHub API geçici hataları ("No server is currently available") release
      # yayınlama adımını öldürebiliyor; bu yüzden gh CLI ile yeniden deneme
      # döngüsü kullanılır. Build başarılıysa APK eninde sonunda yayınlanır.
      - name: Publish APK to Release (latest)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          VERSION="${{ steps.ver.outputs.version }}"
          APK="app/build/outputs/apk/release/app-release.apk"
          NOTES="Automatically built APK (refreshed on every push)."
          for i in 1 2 3 4 5 6; do
            if gh release view latest >/dev/null 2>&1; then
              if gh release edit latest --title "Portio v${VERSION} – Latest APK" --notes "$NOTES" \
                 && gh release upload latest "$APK" --clobber; then
                echo "✅ Release güncellendi: Portio v${VERSION}"
                exit 0
              fi
            else
              if gh release create latest "$APK" --title "Portio v${VERSION} – Latest APK" --notes "$NOTES"; then
                echo "✅ Release oluşturuldu: Portio v${VERSION}"
                exit 0
              fi
            fi
            echo "⚠️ GitHub API geçici hatası — 30 sn sonra yeniden deneniyor (deneme $i/6)"
            sleep 30
          done
          echo "❌ Release yayınlanamadı (6 deneme sonrası)"
          exit 1