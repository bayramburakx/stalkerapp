name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Extract version
        id: ver
        run: |
          V=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: stalkerapp-release
          path: app/build/outputs/apk/release/*.apk

      - name: Publish APK to Release (latest)
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'push'
        with:
          tag_name: latest
          name: Stalker Player v${{ steps.ver.outputs.version }} – Güncel APK
          body: |
            Otomatik derlenen güncel APK (her push'ta yenilenir).

            En son değişiklikler:
            - Alt menü: siyah bar kaldırıldı, sadece pill-shaped arka planlar kaldı
            - Hero banner ekranın ~1.5/3'ü kadar büyütüldü
            - VOD senkron düzeltildi: tüm katalog (80k+ içerik) çekiliyor
            - Eski/eksik katalog otomatik olarak yeniden senkronlanıyor
          files: app/build/outputs/apk/release/*.apk
          update_existing: true
          overwrite: true
          token: ${{ secrets.GITHUB_TOKEN }}
